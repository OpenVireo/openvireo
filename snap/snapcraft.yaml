name: openvireo
adopt-info: openvireo
grade: stable
base: core22
confinement: strict
compression: lzo

apps:
  openvireo:
    command: usr/bin/openvireo
    common-id: com.openvireo.OpenVireo.desktop
    extensions: [kde-neon]
    plugs: [home, unity7, network, network-bind, removable-media, raw-usb, password-manager-service, browser-native-messaging]
    autostart: com.openvireo.OpenVireo.desktop
  cli:
    command: usr/bin/openvireo-cli
    extensions: [kde-neon]
    plugs: [home, removable-media, raw-usb]
  proxy:
    command: usr/bin/openvireo-proxy
    extensions: [kde-neon]

plugs:
  browser-native-messaging:
    interface: personal-files
    write:
      - $HOME/.mozilla/native-messaging-hosts/com.openvireo.browser.json
      - $HOME/.config/chromium/NativeMessagingHosts/com.openvireo.browser.json
      - $HOME/.config/google-chrome/NativeMessagingHosts/com.openvireo.browser.json
      - $HOME/.config/microsoft-edge/NativeMessagingHosts/com.openvireo.browser.json
      - $HOME/.config/vivaldi/NativeMessagingHosts/com.openvireo.browser.json
      - $HOME/.config/BraveSoftware/Brave-Browser/NativeMessagingHosts/com.openvireo.browser.json
      - $HOME/.local/share/torbrowser/tbb/x86_64/tor-browser_en-US/Browser/TorBrowser/Data/Browser/.mozilla/native-messaging-hosts/com.openvireo.browser.json

slots:
  session-dbus-interface:
    interface: dbus
    name: com.openvireo.OpenVireo.MainWindow
    bus: session

parts:
  openvireo:
    source: .
    plugin: cmake
    parse-info: [usr/share/metainfo/com.openvireo.OpenVireo.appdata.xml]
    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DKEEPASSXC_DIST_TYPE=Snap
      - -DKEEPASSXC_BUILD_TYPE=Release
      - -DWITH_TESTS=OFF
      - -DWITH_XC_ALL=ON
      - -DWITH_XC_UPDATECHECK=OFF
    build-packages:
      - g++
      - libbotan-2-dev
      - libargon2-dev
      - zlib1g-dev
      - libqrencode-dev
      - libusb-1.0-0-dev
      - libreadline-dev
      - libpcsclite-dev
      - libminizip-dev
      - libxi-dev
      - libxtst-dev
      - asciidoctor
      - libfreetype-dev
      - libkeyutils-dev
    stage-packages:
      - dbus
      - libbotan-2-19
      - libqrencode4
      - libusb-1.0-0
      - libreadline8
      - libpcsclite1
      - libminizip1
      - libxtst6
      - libfreetype6
      - xclip
      - libkeyutils1
lint:
  ignore:
    - library:
      - lib/**/libhistory.so*

