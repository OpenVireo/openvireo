openapi: 3.1.0
info:
  title: OpenVireo sync server JWT routes (ov v1)
  version: 1.0.0
  description: |
    New routes on `openvireo-sync-server` when SYNC_AUTH_MODE is `jwt` or `both` (SPEC.md §11 and §13).
    Shared schemas and the error format come from openapi.yaml. Legacy routes (`/databases/*`,
    `/devices/pairing*`, `/health`, legacy `/events`) are unchanged and not repeated here.
    CORS: every route answers preflight for origins in SYNC_ALLOWED_ORIGINS and exposes
    `ETag, X-Database-Revision, Last-Modified`, allowing headers `Authorization, Content-Type, If-Match, If-None-Match`.
servers:
  - url: https://sync.openvireo.com/api/v1
security:
  - bearer: []
paths:
  # ---------------------------------------------------------------- sync server (JWT mode)
  /vaults:
    get:
      tags: [sync]
      summary: Metadata of the vault blobs in the token's vlt claim that exist (any role)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  vaults: { type: array, items: { $ref: './openapi.yaml#/components/schemas/BlobMeta' } }
  /vaults/{vault}:
    parameters: [ { $ref: './openapi.yaml#/components/parameters/Vault' } ]
    get:
      tags: [sync]
      summary: Download (read). Supports If-None-Match → 304. HEAD works the same and returns no body.
      responses:
        '200':
          description: OK
          headers: { ETag: { schema: { type: string } }, X-Database-Revision: { schema: { type: integer } }, Last-Modified: { schema: { type: string } } }
          content: { application/octet-stream: {} }
        '304': { description: not modified }
        '403': { $ref: './openapi.yaml#/components/responses/Error', description: vault not in token }
        '404': { $ref: './openapi.yaml#/components/responses/Error' }
    put:
      tags: [sync]
      summary: |
        Upload. With `If-None-Match: *` it creates the blob (manage). With `If-Match: "<etag>"` it updates it (write).
        A missing precondition gets 428, a mismatch 412 (as for legacy databases). Publishes event `vault`.
      requestBody: { content: { application/octet-stream: {} } }
      responses:
        '200': { description: updated; same headers as GET }
        '201': { description: created }
        '403': { $ref: './openapi.yaml#/components/responses/Error' }
        '412': { $ref: './openapi.yaml#/components/responses/Error' }
        '428': { $ref: './openapi.yaml#/components/responses/Error' }
    delete:
      tags: [sync]
      summary: Delete (manage). Publishes event `vault` with deleted:true.
      responses: { '204': { description: deleted } }
  /vaults/{vault}/history:
    parameters: [ { $ref: './openapi.yaml#/components/parameters/Vault' } ]
    get:
      tags: [sync]
      summary: Version history (read), the same shape as the existing per-database history
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  versions: { type: array, items: { $ref: './openapi.yaml#/components/schemas/BlobMeta' } }
        '403': { $ref: './openapi.yaml#/components/responses/Error' }
        '404': { $ref: './openapi.yaml#/components/responses/Error' }
  /vaults/{vault}/history/{revision}:
    parameters:
      - { $ref: './openapi.yaml#/components/parameters/Vault' }
      - { name: revision, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      tags: [sync]
      summary: One kept version's bytes (read)
      responses:
        '200': { description: OK, content: { application/octet-stream: {} } }
        '403': { $ref: './openapi.yaml#/components/responses/Error' }
        '404': { $ref: './openapi.yaml#/components/responses/Error' }
  /events:
    get:
      tags: [sync]
      summary: SSE stream (SPEC §11). With a JWT it carries `vault` and `access` events and closes at the token's exp.
      responses: { '200': { description: OK, content: { text/event-stream: {} } } }
  /internal/notify:
    post:
      tags: [sync]
      security: [ { internal: [] } ]
      summary: The auth server pushes `access` events to subjects' streams. 404 when SYNC_INTERNAL_TOKEN is unset.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [subjects, event, data]
              properties:
                subjects: { type: array, items: { $ref: './openapi.yaml#/components/schemas/Principal' } }
                event: { const: access }
                data:
                  type: object
                  properties:
                    vault: { type: [string, 'null'], format: uuid }
                    change: { enum: [granted, revoked, rotating, rotated, org] }
      responses: { '204': { description: delivered (best effort) } }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT, description: an access token with aud ov-sync; in `both` mode a device token works on the legacy routes }
    internal: { type: http, scheme: bearer, description: SYNC_INTERNAL_TOKEN shared secret }
