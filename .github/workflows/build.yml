name: "Build Packages"

# Builds the downloadable packages with release-tool.py; called by the nightly and release workflows.
# macOS and Windows build Qt and the other dependencies with vcpkg, which takes hours on a cold cache.
# The vcpkg binary cache is saved even when a build fails, so a re-run picks up where the last one stopped.

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build"
        type: string
        required: true
      version:
        description: "Version number in CMakeLists.txt, e.g. 2.8.0"
        type: string
        required: true
      snapshot-version:
        description: "Build a snapshot from ref, shown as this version (empty for a tagged release build)"
        type: string
        default: ""
      update-channel:
        description: "Update channel the packages follow: stable or nightly"
        type: string
        default: stable
      update-build:
        description: "Build number of a nightly, appended to its update version"
        type: string
        default: ""
    secrets:
      MACOS_CERTIFICATE_P12:
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_APP_PASSWORD:
        required: false
      # Azure Artifact Signing, through an app registration with a federated credential for this repository
      AZURE_CLIENT_ID:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_SUBSCRIPTION_ID:
        required: false
      # Signing subkey without a passphrase; signs the AppImages
      GPG_PRIVATE_KEY:
        required: false

permissions:
  contents: read

# Pinned downloads; update the version and checksum together
env:
  SPARKLE_VERSION: "2.10.0"
  SPARKLE_SHA256: c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c
  WINSPARKLE_VERSION: "0.9.4"
  WINSPARKLE_SHA256: 6037df37fc263bd1650a1c4949681a9d40ffe991d01f35892a406cb5d103c976
  ARTIFACT_SIGNING_CLIENT_VERSION: "1.0.146"
  ARTIFACT_SIGNING_CLIENT_SHA256: 7761e5d8f31e54b764da21d33cd8b0a2940e1b05526c7dfcb5e94b0431426f70

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    # One OIDC subject for nightlies and release tags alike, which Azure's federated credential matches;
    # the environment's protection rules can also restrict which refs get signed
    environment: signing
    permissions:
      contents: read
      # Signs in to Azure with OIDC for Artifact Signing
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both macOS builds run on Apple Silicon. vcpkg's default host triplet, arm64-osx, would build
          # a second, debug and release Qt for the host tools, which does not fit on the runner's disk.
          # The arm64 build is its own host; the x86_64 build needs a static host Qt, because CMakeLists.txt
          # copies macdeployqt into the target's tools and a dynamic one would load x86_64 Qt libraries.
          - name: macOS arm64
            os: macos-15
            platform: macos
            arch: arm64
            host-triplet: arm64-osx-dynamic-release
          - name: macOS x86_64
            os: macos-15
            platform: macos
            arch: x86_64
            host-triplet: arm64-osx-release
          # The oldest supported Ubuntu keeps the AppImage's glibc requirement low; it has Qt 6.2.4
          - name: Linux x86_64
            os: ubuntu-22.04
            platform: linux
            arch: x86_64
          - name: Linux aarch64
            os: ubuntu-22.04-arm
            platform: linux
            arch: aarch64
          - name: Windows x64
            os: windows-2022
            platform: windows
            arch: amd64
    defaults:
      run:
        shell: bash
    env:
      # linuxdeploy and appimagetool are AppImages themselves, and the runners have no FUSE
      APPIMAGE_EXTRACT_AND_RUN: 1
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      HAS_MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
      HAS_ARTIFACT_SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' && vars.ARTIFACT_SIGNING_ACCOUNT != '' }}
      HAS_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY != '' }}
      # The Ed25519 key that Sparkle and WinSparkle verify updates with; without it they are left out
      UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          # release-tool.py checks out the release tag by name
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up paths
        run: |
          echo "OUTPUT_DIR=$GITHUB_WORKSPACE/release-out" >> "$GITHUB_ENV"
          echo "OPAQUE_PREFIX=$RUNNER_TEMP/opaque" >> "$GITHUB_ENV"
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_CACHE=$RUNNER_TEMP/vcpkg-cache" >> "$GITHUB_ENV"

      - name: Install dependencies (macOS)
        if: matrix.platform == 'macos'
        # release-tool.py requires gpg even when it does not sign
        run: brew install ninja asciidoctor gnupg pkgconf autoconf autoconf-archive automake libtool

      - name: Install dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake ninja-build pkgconf asciidoctor file \
            qt6-base-dev qt6-base-private-dev qt6-base-dev-tools qmake6 qt6-tools-dev qt6-tools-dev-tools \
            qt6-l10n-tools libqt6svg6-dev qt6-wayland qt6-qpa-plugins libgl-dev \
            libbotan-2-dev libminizip-dev libqrencode-dev zlib1g-dev libreadline-dev libkeyutils-dev \
            libpcsclite-dev libusb-1.0-0-dev libxi-dev libxtst-dev libxkbcommon-dev

      - name: Install dependencies (Windows)
        if: matrix.platform == 'windows'
        run: |
          git config --global core.longpaths true
          gem install asciidoctor --no-document
          # WiX 3 for the MSI; release-tool.py looks for candle.exe, light.exe and heat.exe on the PATH
          curl -fsSL -o "$RUNNER_TEMP/wix.zip" \
            https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip
          mkdir -p "$RUNNER_TEMP/wix" && unzip -q "$RUNNER_TEMP/wix.zip" -d "$RUNNER_TEMP/wix"
          cygpath -w "$RUNNER_TEMP/wix" >> "$GITHUB_PATH"

      # Windows gets libopaque from the vcpkg overlay port in utils/vcpkg_ports instead
      - name: Build libopaque
        if: matrix.platform != 'windows'
        env:
          MACOS_ARCH: ${{ matrix.platform == 'macos' && matrix.arch || '' }}
        run: .github/scripts/build-opaque.sh "$OPAQUE_PREFIX"

      - name: Set up vcpkg
        if: matrix.platform != 'linux'
        run: |
          baseline=$(python -c "import json; print(json.load(open('vcpkg.json'))['builtin-baseline'])")
          git clone --quiet https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout --quiet "$baseline"
          if [ "$RUNNER_OS" = Windows ]; then
            "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          else
            "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          fi
          mkdir -p "$VCPKG_CACHE"
          echo "VCPKG_BINARY_SOURCES=clear;files,$VCPKG_CACHE,readwrite" >> "$GITHUB_ENV"
          echo "VCPKG_CACHE_PREFIX=vcpkg-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg/triplets/**', 'utils/vcpkg_ports/**') }}" >> "$GITHUB_ENV"

      # Saved caches are keyed by their contents, so only restore-keys match: this restores the newest
      # cache for this manifest, or the newest for this platform if the manifest changed
      - name: Restore vcpkg binary cache
        if: matrix.platform != 'linux'
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_CACHE }}
          key: ${{ env.VCPKG_CACHE_PREFIX }}
          restore-keys: |
            ${{ env.VCPKG_CACHE_PREFIX }}-
            vcpkg-${{ matrix.platform }}-${{ matrix.arch }}-

      - name: Download Sparkle (macOS)
        if: matrix.platform == 'macos' && env.UPDATE_PUBLIC_KEY != ''
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          echo "$SPARKLE_SHA256  $RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/sparkle" && tar -xJf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          echo "UPDATER_CMAKE_OPT=-DSPARKLE_ROOT=$RUNNER_TEMP/sparkle" >> "$GITHUB_ENV"

      - name: Download WinSparkle (Windows)
        if: matrix.platform == 'windows' && env.UPDATE_PUBLIC_KEY != ''
        run: |
          curl -fsSL -o "$RUNNER_TEMP/winsparkle.zip" \
            "https://github.com/vslavik/winsparkle/releases/download/v$WINSPARKLE_VERSION/WinSparkle-$WINSPARKLE_VERSION.zip"
          echo "$WINSPARKLE_SHA256  $RUNNER_TEMP/winsparkle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/winsparkle.zip" -d "$RUNNER_TEMP/winsparkle" -x '__MACOSX/*'
          echo "UPDATER_CMAKE_OPT=-DWINSPARKLE_ROOT=$(cygpath -m "$RUNNER_TEMP/winsparkle/WinSparkle-$WINSPARKLE_VERSION")" >> "$GITHUB_ENV"

      - name: Sign in to Azure (Windows)
        if: matrix.platform == 'windows' && env.HAS_ARTIFACT_SIGNING == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Artifact Signing (Windows)
        id: windows-signing
        if: matrix.platform == 'windows' && env.HAS_ARTIFACT_SIGNING == 'true'
        env:
          ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          # SignTool's dlib for Artifact Signing; it signs with the Azure CLI login from the previous step
          curl -fsSL -o "$RUNNER_TEMP/signing-client.nupkg" \
            "https://api.nuget.org/v3-flatcontainer/microsoft.artifactsigning.client/$ARTIFACT_SIGNING_CLIENT_VERSION/microsoft.artifactsigning.client.$ARTIFACT_SIGNING_CLIENT_VERSION.nupkg"
          echo "$ARTIFACT_SIGNING_CLIENT_SHA256  $RUNNER_TEMP/signing-client.nupkg" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/signing-client.nupkg" -d "$RUNNER_TEMP/signing-client"
          python - "$RUNNER_TEMP/signing-metadata.json" <<'EOF'
          import json, os, sys
          excluded = ["EnvironmentCredential", "ManagedIdentityCredential", "WorkloadIdentityCredential",
                      "SharedTokenCacheCredential", "VisualStudioCredential", "VisualStudioCodeCredential",
                      "AzurePowerShellCredential", "AzureDeveloperCliCredential", "InteractiveBrowserCredential"]
          json.dump({"Endpoint": os.environ["ENDPOINT"], "CodeSigningAccountName": os.environ["ACCOUNT"],
                     "CertificateProfileName": os.environ["PROFILE"], "ExcludeCredentials": excluded},
                    open(sys.argv[1], "w"), indent=2)
          EOF
          dlib=$(cygpath -m "$RUNNER_TEMP/signing-client/bin/x64/Azure.CodeSigning.Dlib.dll")
          metadata=$(cygpath -m "$RUNNER_TEMP/signing-metadata.json")
          echo "args=--sign --sign-dlib $dlib --sign-metadata $metadata" >> "$GITHUB_OUTPUT"

      - name: Import GPG key (Linux)
        id: linux-signing
        if: matrix.platform == 'linux' && env.HAS_GPG_KEY == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          key=$(gpg --list-secret-keys --with-colons | awk -F: '$1 == "fpr" { print $10; exit }')
          echo "args=--appimage-sign-key $key" >> "$GITHUB_OUTPUT"

      - name: Import signing certificate (macOS)
        id: macos-signing
        if: matrix.platform == 'macos' && env.HAS_MACOS_CERTIFICATE == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 16)
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          if [ -n "$APPLE_ID" ]; then
            xcrun notarytool store-credentials notarization-creds --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$keychain"
            echo "args=--sign --autofill --notarize --keychain-profile notarization-creds" >> "$GITHUB_OUTPUT"
          else
            echo "args=--sign --autofill" >> "$GITHUB_OUTPUT"
          fi

      - name: Build packages
        env:
          VERSION: ${{ inputs.version }}
          SNAPSHOT_VERSION: ${{ inputs.snapshot-version }}
          UPDATE_CHANNEL: ${{ inputs.update-channel }}
          UPDATE_BUILD: ${{ inputs.update-build }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          if [ -n "${{ steps.windows-signing.outputs.args }}" ]; then
            # The Azure login from before the build expires long before SignTool runs
            bash .github/scripts/azure-login-refresh.sh &
            refresh_pid=$!
            trap 'kill $refresh_pid' EXIT
          fi
          args=(build "$VERSION" --yes --output-dir "$OUTPUT_DIR" --platform-target "${{ matrix.arch }}")
          if [ -n "$SNAPSHOT_VERSION" ]; then
            args+=(--snapshot --override-version "$SNAPSHOT_VERSION")
          fi
          # Update checks follow this build's channel; Sparkle and WinSparkle come with the public key
          update_opts=(-DKPXC_FEATURE_UPDATES=ON "-DKPXC_UPDATE_CHANNEL=$UPDATE_CHANNEL"
                       "-DKPXC_UPDATE_BUILD=$UPDATE_BUILD" "-DKPXC_UPDATE_PUBLIC_KEY=$UPDATE_PUBLIC_KEY")
          if [ -n "$UPDATER_CMAKE_OPT" ]; then
            update_opts+=("$UPDATER_CMAKE_OPT")
          fi
          appimage_tag=latest
          if [ "$UPDATE_CHANNEL" = nightly ]; then
            appimage_tag=nightly
          fi
          case "${{ matrix.platform }}" in
            macos)
              args+=(--build-qt ${{ steps.macos-signing.outputs.args }} --cmake-opts
                     -DKPXC_FEATURE_ACCOUNTS=ON "-DOPAQUE_ROOT=$OPAQUE_PREFIX"
                     "-DSODIUM_LIBRARY=$OPAQUE_PREFIX/lib/libsodium.a"
                     -DVCPKG_HOST_TRIPLET=${{ matrix.host-triplet }} -DVCPKG_INSTALL_OPTIONS=--clean-after-build
                     "${update_opts[@]}")
              ;;
            linux)
              args+=(--use-system-deps --appimage --appimage-update-tag "$appimage_tag"
                     ${{ steps.linux-signing.outputs.args }} --cmake-opts
                     -DKPXC_FEATURE_ACCOUNTS=ON "-DOPAQUE_ROOT=$OPAQUE_PREFIX"
                     "-DSODIUM_LIBRARY=$OPAQUE_PREFIX/lib/libsodium.a" "${update_opts[@]}")
              ;;
            windows)
              # Release-only triplets build Qt once instead of in debug and release; the host triplet
              # must match so that windeployqt comes from the same Qt
              args+=(--build-qt ${{ steps.windows-signing.outputs.args }} --cmake-opts -DKPXC_FEATURE_ACCOUNTS=ON
                     -DVCPKG_TARGET_TRIPLET=x64-windows-release -DVCPKG_HOST_TRIPLET=x64-windows-release
                     -DVCPKG_INSTALL_OPTIONS=--clean-after-build "${update_opts[@]}")
              ;;
          esac
          # SODIUM_LIBRARY is named explicitly so a shared libsodium elsewhere on the runner is never linked.
          # --clean-after-build deletes each port's build tree once it is installed; Qt's build trees would fill the runner's disk.
          python release-tool.py "${args[@]}"

      - name: Prepare vcpkg binary cache
        if: always() && matrix.platform != 'linux'
        run: |
          # The cache is content-addressed by file name, so its listing identifies it; an unchanged cache
          # gets the key it was restored from and is not uploaded again
          contents=$(cd "$VCPKG_CACHE" && find . -type f | sort | python -c "import hashlib, sys; print(hashlib.sha256(sys.stdin.buffer.read()).hexdigest()[:16])")
          echo "VCPKG_CACHE_KEY=$VCPKG_CACHE_PREFIX-$contents" >> "$GITHUB_ENV"

      - name: Save vcpkg binary cache
        if: always() && matrix.platform != 'linux'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_CACHE }}
          key: ${{ env.VCPKG_CACHE_KEY }}

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release-out/*.dmg
            release-out/*.AppImage
            release-out/*.AppImage.zsync
            release-out/*.msi
            release-out/*.zip
