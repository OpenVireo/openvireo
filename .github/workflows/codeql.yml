name: "CodeQL"

on:
  push:
    branches:
      - 'develop'
      - 'release/**'
  pull_request:
  schedule:
    - cron: '5 16 * * 3'

jobs:
  analyze:
    name: Analyze
    # Pinned: ubuntu-latest moved to 26.04, which has no libbotan-2-dev
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-24.04' }}
    timeout-minutes: ${{ (matrix.language == 'swift' && 120) || 360 }}
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp' ]
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python', 'ruby' ]
        # Use only 'java' to analyze code written in Java, Kotlin or both
        # Use only 'javascript' to analyze code written in JavaScript, TypeScript or both
        # Learn more about CodeQL language support at https://aka.ms/codeql-docs/language-support

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - if: matrix.language == 'cpp'
      name: Install dependencies
      run: |
        sudo apt update
        sudo apt install build-essential cmake g++ pkgconf
        sudo apt install qt6-base-dev qt6-base-private-dev qt6-tools-dev qt6-base-dev-tools qt6-svg-dev qt6-5compat-dev libkeyutils-dev libminizip-dev libbotan-2-dev libqrencode-dev zlib1g-dev asciidoctor libreadline-dev libpcsclite-dev libusb-1.0-0-dev libxi-dev libxtst-dev

    # So the analysis covers the accounts code that needs OPAQUE (account/OpaqueClient.cpp);
    # built before CodeQL starts tracing so the third-party libraries are not analysed
    - if: matrix.language == 'cpp'
      name: Build libopaque
      run: .github/scripts/build-opaque.sh "$RUNNER_TEMP/opaque"

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.

        # For more details on CodeQL's query packs, refer to: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
        queries: security-and-quality

    - if: matrix.language == 'cpp'
      name: Build C++
      run: |
        mkdir build && cd build
        cmake -DWITH_XC_ALL=ON -DWITH_TESTS=OFF -DKPXC_FEATURE_ACCOUNTS=ON \
              "-DOPAQUE_ROOT=$RUNNER_TEMP/opaque" "-DSODIUM_LIBRARY=$RUNNER_TEMP/opaque/lib/libsodium.a" ..
        make -j $(nproc)

    # Autobuild attempts to build any compiled languages (C/C++, C#, Go, Java, or Swift).
    # If this step fails, then you should remove it and run the build manually (see below)
    - if: matrix.language != 'cpp'
      name: Autobuild
      uses: github/codeql-action/autobuild@v4

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
