name: "Release"

# Builds the packages and source tarball for a release tag (as created by `release-tool.py tag`)
# and attaches them to a draft GitHub release, which is published by hand after checking it.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build, e.g. 2.8.0"
        type: string
        required: true

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Check tag
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must be version numbers like 2.8.0, got '$TAG'"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: prepare
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build.yml
    with:
      ref: refs/tags/${{ needs.prepare.outputs.tag }}
      version: ${{ needs.prepare.outputs.tag }}
      update-channel: stable
    secrets: inherit

  source:
    name: Source tarball
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Build source tarball
        run: python3 release-tool.py build-src "${{ needs.prepare.outputs.tag }}" --yes --output-dir release-out

      - uses: actions/upload-artifact@v4
        with:
          name: packages-source
          if-no-files-found: error
          retention-days: 7
          path: release-out/*.tar.xz

  publish:
    name: Publish draft
    needs: [prepare, build, source]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: packages
          merge-multiple: true

      - name: Write release notes
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          # The release notes are this version's CHANGELOG.md section, without its heading
          awk -v heading="## $TAG " 'index($0, heading) == 1 { found = 1; next } found && /^## / { exit } found' \
            CHANGELOG.md > notes.md

      # The feeds go live when the draft is published: releases/latest skips drafts
      - name: Write update feeds
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if [ -z "$UPDATE_PRIVATE_KEY" ] || [ -z "$UPDATE_PUBLIC_KEY" ]; then
            echo "::warning::UPDATE_PRIVATE_KEY or UPDATE_PUBLIC_KEY is not set; this release has no update feeds"
            exit 0
          fi
          python3 .github/scripts/make-appcast.py packages --channel stable \
            --version "$TAG" --update-version "$TAG" \
            --download-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" \
            --release-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" \
            --notes-file notes.md --expect-public-key "$UPDATE_PUBLIC_KEY"

      - name: Write checksums
        working-directory: packages
        run: sha256sum * > SHA256SUMS.txt

      - name: Sign checksums
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        working-directory: packages
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::warning::GPG_PRIVATE_KEY is not set; SHA256SUMS.txt is not signed"
            exit 0
          fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --armor --detach-sign --output SHA256SUMS.txt.asc SHA256SUMS.txt

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Re-running for a tag replaces the packages and keeps any edits to the release text
            gh release upload "$TAG" packages/* --clobber
          else
            # 0.x releases are betas. They are still full releases, not pre-releases, so the stable update
            # feeds (releases/latest) serve them
            title="OpenVireo $TAG"
            if [[ "$TAG" == 0.* ]]; then
              title="$title beta"
            fi
            gh release create "$TAG" packages/* --draft --verify-tag --title "$title" --notes-file notes.md
          fi
